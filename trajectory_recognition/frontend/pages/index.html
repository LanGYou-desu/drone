<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>轨迹识别 — 鹰眼长空</title>
    <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
    <nav class="navbar">
        <span class="navbar-brand">🛸 鹰眼长空</span>
        <div class="navbar-links">
            <a href="http://127.0.0.1:5000">📡 重建分析</a>
            <a href="/" class="active">🧬 轨迹识别</a>
        </div>
    </nav>

    <div class="page">
        <div class="page-header">
            <h1>🧬 轨迹识别</h1>
            <p>读取共享轨迹数据，进行模式识别与分类</p>
        </div>

        <div class="grid grid-3">
            <div class="card">
                <div class="card-header"><h3>🔍 特征提取</h3></div>
                <p style="color:var(--text-secondary);font-size:0.85rem;">从轨迹数据中提取速度、加速度、曲率等运动学特征。</p>
                <div class="stat" style="margin-top:12px;">
                    <div class="stat-value" style="color:var(--text-tertiary);font-size:1.2rem;">待实现</div>
                </div>
            </div>
            <div class="card">
                <div class="card-header"><h3>🧠 识别模型</h3></div>
                <p style="color:var(--text-secondary);font-size:0.85rem;">基于规则的分类器与机器学习模型。</p>
                <div class="stat" style="margin-top:12px;">
                    <div class="stat-value" style="color:var(--text-tertiary);font-size:1.2rem;">待实现</div>
                </div>
            </div>
            <div class="card">
                <div class="card-header"><h3>🏷️ 分类器</h3></div>
                <p style="color:var(--text-secondary);font-size:0.85rem;">输出轨迹类型、飞行模式识别结果与异常检测。</p>
                <div class="stat" style="margin-top:12px;">
                    <div class="stat-value" style="color:var(--text-tertiary);font-size:1.2rem;">待实现</div>
                </div>
            </div>
        </div>

        <div class="grid grid-2" style="margin-top:20px;">
            <div class="card">
                <div class="card-header"><h3>📊 系统状态</h3></div>
                <div id="statusPanel" style="font-size:0.85rem;color:var(--text-secondary);">加载中...</div>
            </div>
            <div class="card">
                <div class="card-header"><h3>📁 共享数据</h3></div>
                <div id="dataPanel" style="font-size:0.85rem;color:var(--text-secondary);">加载中...</div>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>
    <script type="module" src="/static/js/pages/recognition.js"></script>
</body>
</html>
