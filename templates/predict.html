{% extends "base.html" %}
{% block title %}轨迹预测 — 鹰眼长空{% endblock %}
{% block content %}

<div class="page">
    <div class="page-header">
        <h1>🔮 轨迹预测</h1>
        <p>基于历史轨迹的线性外推预测，支持单平台和全平台预测</p>
    </div>

    <div class="grid grid-2" style="margin-bottom:20px;">
        <!-- 预测参数 -->
        <div class="card">
            <div class="card-header"><h3>预测参数</h3></div>
            <div style="display:flex;flex-direction:column;gap:12px;">
                <div>
                    <label>目标平台</label>
                    <select id="predictPlatform">
                        <option value="all">所有平台</option>
                        {% for id, m in methods_data.items() %}
                        <option value="{{ id }}">{{ m.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label>预测点数: <strong id="numPointsLabel">{{ pred_settings.default_points }}</strong></label>
                    <input type="range" id="numPointsSlider"
                           min="{{ pred_settings.min_points }}" max="{{ pred_settings.max_points }}"
                           value="{{ pred_settings.default_points }}" step="1">
                </div>
                <div>
                    <label>时间步长 (秒)</label>
                    <input type="number" id="timeStep" value="{{ pred_settings.time_step }}" step="0.1" min="0.1" max="5">
                </div>
                <button class="btn btn-primary btn-lg" id="predictBtn">⚡ 开始预测</button>
            </div>
        </div>

        <!-- 预测结果 -->
        <div class="card">
            <div class="card-header"><h3>预测结果</h3></div>
            <div id="predictResults">
                <p style="color:var(--text-secondary);font-size:0.85rem;">选择参数后点击"开始预测"</p>
            </div>
        </div>
    </div>

    <!-- 3D 预览 -->
    <div class="card">
        <div class="card-header">
            <h3>预测轨迹预览</h3>
            <div class="btn-group">
                <button class="btn btn-sm btn-secondary" id="playBtn">▶ 播放</button>
                <button class="btn btn-sm btn-secondary" id="stopBtn">⏹ 停止</button>
                <select id="speedSelect" style="width:auto;margin:0;">
                    <option value="0.5">0.5×</option><option value="1" selected>1×</option>
                    <option value="2">2×</option><option value="4">4×</option>
                </select>
            </div>
        </div>
        <div class="viewer-panel" id="predictViewer"></div>
    </div>
</div>

{% endblock %}

{% block scripts %}
<script type="importmap">
{
    "imports": {
        "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
    }
}
</script>
<script>
    window._PAGE_DATA_ = {
        methodsData: {{ methods_data | tojson }},
        predSettings: {{ pred_settings | tojson }}
    };
</script>
<script type="module" src="/static/js/pages/predict.js"></script>
{% endblock %}
