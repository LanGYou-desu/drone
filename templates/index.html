{% extends "base.html" %}
{% block title %}总览 — 鹰眼长空{% endblock %}
{% block content %}

<!-- 全屏 3D 视图 -->
<div class="viewer-full" id="viewer"></div>

<!-- 左上角：平台图例 -->
<div class="overlay-panel" style="top:68px;left:16px;min-width:180px;">
    <h3 style="font-size:0.8rem;color:var(--text-secondary);margin-bottom:8px;">📡 检测平台</h3>
    <div id="legendList">
        {% for id, m in methods_data.items() %}
        <div class="list-item" data-id="{{ id }}" style="padding:6px 8px;"
             onclick="toggleMethod('{{ id }}')">
            <span class="legend-dot" style="background:{{ m.color }};color:{{ m.color }};"></span>
            <span class="list-item-title">{{ m.name }}</span>
            <span class="badge {% if m.visible %}badge-green{% else %}badge-red{% endif %}"
                  id="status-{{ id }}">{% if m.visible %}显示{% else %}隐藏{% endif %}</span>
        </div>
        {% endfor %}
    </div>
</div>

<!-- 右上角：实时参数 -->
<div class="overlay-panel" style="top:68px;right:16px;width:200px;">
    <h3 style="font-size:0.8rem;color:var(--text-secondary);margin-bottom:8px;">📋 实时数据</h3>
    <div style="font-size:0.8rem;" id="realtimeStats">
        <div style="display:flex;justify-content:space-between;padding:3px 0;">
            <span>轨迹点</span><span id="totalPoints" style="font-weight:600;">0</span>
        </div>
        <div style="display:flex;justify-content:space-between;padding:3px 0;">
            <span>速度</span><span id="currentSpeed" style="font-weight:600;">--</span>
        </div>
        <div style="display:flex;justify-content:space-between;padding:3px 0;">
            <span>高度</span><span id="currentHeight" style="font-weight:600;">--</span>
        </div>
        <div style="display:flex;justify-content:space-between;padding:3px 0;">
            <span>更新时间</span><span id="lastUpdate" style="font-weight:600;">--</span>
        </div>
    </div>
</div>

<!-- 底部中央：快速操作 -->
<div class="overlay-panel" style="bottom:24px;left:50%;transform:translateX(-50%);display:flex;gap:8px;">
    <button class="btn btn-primary" id="playBtn">▶ 播放</button>
    <button class="btn btn-secondary" id="stopBtn">⏹ 停止</button>
    <select id="speedSelect" style="width:auto;margin:0;">
        <option value="0.5">0.5×</option>
        <option value="1" selected>1×</option>
        <option value="2">2×</option>
        <option value="4">4×</option>
    </select>
    <input type="range" id="timelineSlider" min="0" max="100" value="0"
           style="width:200px;margin:0;">
    <a href="/predict" class="btn btn-secondary">🔮 预测 →</a>
</div>

<!-- 坐标提示 -->
<div id="coordTooltip" class="tooltip" style="display:none;"></div>

{% endblock %}

{% block scripts %}
<script type="importmap">
{
    "imports": {
        "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
    }
}
</script>
<script>
    // 后端数据注入（静态 JS 无法使用 Jinja2 模板语法）
    window._PAGE_DATA_ = {
        methodsData: {{ methods_data | tojson }},
        predSettings: {{ pred_settings | tojson }}
    };
</script>
<script type="module" src="/static/js/pages/dashboard.js"></script>
{% endblock %}
