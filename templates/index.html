{% extends "base.html" %}
{% block title %}总览 — 鹰眼长空{% endblock %}
{% block content %}

<!-- 全屏 3D 视图 -->
<div class="viewer-full" id="viewer"></div>

<!-- 左上角：平台图例 -->
<div class="overlay-panel" style="top:72px;left:20px;min-width:200px;">
    <h3>检测平台</h3>
    <div id="legendList">
        {% for id, m in methods_data.items() %}
        <div class="list-item" data-id="{{ id }}"
             onclick="toggleMethod('{{ id }}')">
            <span class="legend-dot" style="background:{{ m.color }};color:{{ m.color }};"></span>
            <span class="list-item-title">{{ m.name }}</span>
            <span class="badge {% if m.visible %}badge-green{% else %}badge-red{% endif %}"
                  id="status-{{ id }}">{% if m.visible %}显示{% else %}隐藏{% endif %}</span>
        </div>
        {% endfor %}
    </div>
</div>

<!-- 右上角：实时参数 -->
<div class="overlay-panel" style="top:72px;right:20px;width:220px;">
    <h3>实时数据</h3>
    <div style="font-size:0.82rem;" id="realtimeStats">
        <div class="info-card" style="margin:4px 0;padding:8px 10px;">
            <div class="row"><span class="label">轨迹点</span><span class="value" id="totalPoints">0</span></div>
            <div class="row"><span class="label">速度</span><span class="value highlight" id="currentSpeed">--</span></div>
            <div class="row"><span class="label">高度</span><span class="value" id="currentHeight">--</span></div>
        </div>
        <div style="font-size:0.7rem;color:var(--text-tertiary);text-align:right;" id="lastUpdate">--:--:--</div>
    </div>
</div>

<!-- 底部中央：播放控制条 -->
<div class="overlay-panel" style="bottom:28px;left:50%;transform:translateX(-50%);padding:12px 20px;">
    <div style="display:flex;align-items:center;gap:10px;">
        <button class="btn btn-primary btn-sm" id="playBtn" style="margin:0;width:auto;">▶ 播放</button>
        <button class="btn btn-secondary btn-sm" id="stopBtn" style="margin:0;width:auto;">⏹ 停止</button>
        <select id="speedSelect" style="width:72px;margin:0;">
            <option value="0.5">0.5×</option>
            <option value="1" selected>1×</option>
            <option value="2">2×</option>
            <option value="4">4×</option>
        </select>
        <input type="range" id="timelineSlider" min="0" max="100" value="0"
               style="width:180px;margin:0;" title="拖动调整播放进度">
        <a href="/predict" class="btn btn-sm" style="margin:0;width:auto;text-decoration:none;white-space:nowrap;">🔮 预测</a>
    </div>
</div>

<!-- 坐标提示 -->
<div id="coordTooltip" class="tooltip" style="display:none;"></div>

{% endblock %}

{% block scripts %}
<script type="importmap">
{
    "imports": {
        "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
    }
}
</script>
<script>
    // 后端数据注入（静态 JS 无法使用 Jinja2 模板语法）
    window._PAGE_DATA_ = {
        methodsData: {{ methods_data | tojson }},
        predSettings: {{ pred_settings | tojson }}
    };
</script>
<script type="module" src="/static/js/pages/dashboard.js"></script>
{% endblock %}
