{% extends "base.html" %}
{% block title %}数据分析 — 鹰眼长空{% endblock %}

{% block extra_css %}
<style>
    .chart-card {
        background: var(--bg-card);
        border-radius: var(--radius-xl);
        padding: 18px;
        border: 1px solid var(--separator-opaque);
    }
    .chart-card h3 {
        font-size: 0.85rem; font-weight: 600;
        color: var(--text-secondary); margin-bottom: 8px;
    }
    .chart { height: 360px; width: 100%; }
    .chart-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(520px, 1fr));
        gap: 16px;
    }
    .legend-row {
        display: flex; gap: 16px; flex-wrap: wrap;
        margin-bottom: 20px;
    }
    .legend-item {
        display: flex; align-items: center; gap: 8px;
        padding: 6px 14px;
        background: var(--bg-card);
        border-radius: var(--radius-pill);
        font-size: 0.85rem; font-weight: 500;
        border: 1px solid var(--separator-opaque);
    }
    @media (max-width: 768px) { .chart-grid { grid-template-columns: 1fr; } }
</style>
{% endblock %}

{% block content %}

<div class="page">
    <div class="page-header">
        <h1>📊 轨迹详细分析</h1>
        <p>速度、加速度、曲率、高度 — 多维运动学指标</p>
    </div>

    <div class="legend-row" id="legend"></div>

    <div class="chart-grid">
        <div class="chart-card">
            <h3>高度变化曲线</h3>
            <div id="heightChart" class="chart"></div>
        </div>
        <div class="chart-card">
            <h3>速度变化曲线</h3>
            <div id="speedChart" class="chart"></div>
        </div>
        <div class="chart-card">
            <h3>加速度变化曲线</h3>
            <div id="accelChart" class="chart"></div>
        </div>
        <div class="chart-card">
            <h3>曲率变化曲线（转弯剧烈程度）</h3>
            <div id="curvatureChart" class="chart"></div>
        </div>
    </div>
</div>

{% endblock %}

{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<script>
    const methodsMeta = {{ methods_data | tojson }};
    let allData = {};

    async function load() {
        const r = await (await fetch('/analysis/data')).json();
        allData = r;
        renderLegend();
        renderAll();
    }

    function renderLegend() {
        const el = document.getElementById('legend');
        el.innerHTML = Object.entries(allData).map(([id, info]) =>
            `<div class="legend-item">
                <span class="legend-dot" style="background:${info.color};color:${info.color};"></span>
                ${info.name}
            </div>`).join('');
    }

    function darkOption(series, yName, xData) {
        return {
            tooltip: { trigger: 'axis', backgroundColor: '#2C2C2E', borderColor: '#48484A',
                       textStyle: { color: '#F5F5F7', fontSize: 12 } },
            legend: { show: false },
            xAxis: { type: 'category', data: xData || [], axisLabel: { color: '#8E8E93', fontSize: 10 },
                     axisLine: { lineStyle: { color: '#48484A' } } },
            yAxis: { type: 'value', name: yName, nameTextStyle: { color: '#8E8E93', fontSize: 10 },
                     axisLabel: { color: '#8E8E93', fontSize: 10 },
                     splitLine: { lineStyle: { color: '#363639' } } },
            series,
            grid: { top: 12, bottom: 24, left: 8, right: 20, containLabel: true },
        };
    }

    function renderAll() {
        const ids = Object.keys(allData);
        if (!ids.length) return;
        const times = allData[ids[0]]?.time_steps || [];

        const makeSeries = field => ids.map(id => ({
            name: allData[id].name, type: 'line', data: allData[id][field],
            lineStyle: { color: allData[id].color, width: 2 },
            itemStyle: { color: allData[id].color },
            symbol: 'circle', symbolSize: 4, smooth: true,
        }));

        const init = id => echarts.init(document.getElementById(id));

        init('heightChart').setOption(darkOption(makeSeries('heights'), '高度 (m)', times));
        init('speedChart').setOption(darkOption(makeSeries('speeds'), '速度 (m/s)', times.slice(1)));
        init('accelChart').setOption(darkOption(makeSeries('accelerations'), '加速度 (m/s²)', times.slice(2)));
        init('curvatureChart').setOption(darkOption(makeSeries('curvatures'), '曲率 (1/m)', times.slice(1, -1)));
    }

    window.addEventListener('resize', () => {
        ['heightChart','speedChart','accelChart','curvatureChart'].forEach(id => {
            const inst = echarts.getInstanceByDom(document.getElementById(id));
            if (inst) inst.resize();
        });
    });

    load();
</script>
{% endblock %}
