<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}鹰眼长空{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/main.css">
    {% block extra_css %}{% endblock %}
</head>
<body>

    <!-- 导航栏 -->
    <nav class="navbar">
        <span class="navbar-brand">🛸 鹰眼长空</span>
        <div class="navbar-links">
            <a href="/" class="{% if active_page == 'dashboard' %}active{% endif %}">
                <span class="navbar-icon">🎯</span> 总览
            </a>
            <a href="/predict" class="{% if active_page == 'predict' %}active{% endif %}">
                <span class="navbar-icon">🔮</span> 预测
            </a>
            <a href="/analysis" class="{% if active_page == 'analysis' %}active{% endif %}">
                <span class="navbar-icon">📊</span> 分析
            </a>
            <a href="/ai" class="{% if active_page == 'ai' %}active{% endif %}">
                <span class="navbar-icon">🤖</span> AI 策略
            </a>
            <a href="/data" class="{% if active_page == 'data' %}active{% endif %}">
                <span class="navbar-icon">💾</span> 数据
            </a>
        </div>
        <a href="http://127.0.0.1:5001" style="margin-left:auto;display:flex;align-items:center;gap:6px;padding:6px 16px;border-radius:var(--radius-md);color:var(--text-secondary);font-size:0.85rem;font-weight:500;text-decoration:none;transition:all var(--fast);">
            <span class="navbar-icon">🧬</span> 轨迹识别
        </a>
    </nav>

    <!-- 页面内容 -->
    {% block content %}{% endblock %}

    <!-- Toast 容器 -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- 公共脚本 -->
    {% block scripts %}{% endblock %}
</body>
</html>
